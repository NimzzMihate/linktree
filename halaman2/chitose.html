<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chitose Ikeda - Yuru Yuri</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg-body:#f3e8ff;--bg-card:#ffffff;--text-main:#581c87;--text-muted:#9333ea;--accent:#d8b4fe;--accent-strong:#a855f7;--shadow-color:rgba(168,85,247,0.2)}body.delusion-mode{--bg-body:#ffe4e6;--bg-card:#fff1f2;--text-main:#be123c;--text-muted:#e11d48;--accent:#fda4af;--accent-strong:#e11d48;--shadow-color:rgba(225,29,72,0.3)}body{background-color:var(--bg-body);color:var(--text-main);font-family:'Nunito',sans-serif;transition:all 0.5s ease;overflow-x:hidden;min-height:100vh}h1,h2,h3,.bubbly-font{font-family:'Fredoka',sans-serif}.polka-dots{position:fixed;inset:0;z-index:-2;background-image:radial-gradient(var(--accent) 2px,transparent 2px);background-size:30px 30px;opacity:0.5;transition:opacity 0.5s}.comic-speedlines{position:fixed;inset:0;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(225,29,72,0.1) 0deg 2deg,transparent 2deg 6deg);opacity:0;pointer-events:none;transition:opacity 0.3s;animation:spin-slow 10s linear infinite}@keyframes spin-slow{100%{transform:rotate(360deg)}}body.delusion-mode .polka-dots{opacity:0}body.delusion-mode .comic-speedlines{opacity:1}.cute-card{background-color:var(--bg-card);border-radius:40px;box-shadow:0 20px 40px var(--shadow-color);border:4px solid var(--accent);position:relative;transition:all 0.5s cubic-bezier(0.4,0,0.2,1)}.card-decoration{position:absolute;top:-15px;left:-15px;font-size:40px;color:var(--accent-strong);transform:rotate(-15deg);transition:all 0.5s}body.delusion-mode .cute-card{transform:scale(1.02);animation:comic-shake 0.3s infinite alternate;border-color:var(--accent-strong);box-shadow:0 0 50px var(--shadow-color)}body.delusion-mode .card-decoration{color:var(--accent-strong);transform:scale(1.2) rotate(15deg)}@keyframes comic-shake{0%{transform:rotate(-1deg) scale(1.02)}100%{transform:rotate(1deg) scale(1.02)}}.profile-img-wrap{padding:8px;background:var(--bg-card);border:4px dashed var(--accent-strong);border-radius:50%;transition:all 0.5s;position:relative}.profile-img{border-radius:50%;width:140px;height:140px;object-fit:cover;transition:all 0.5s}body.delusion-mode .profile-img-wrap{border-style:solid;background:var(--accent);box-shadow:0 0 30px var(--accent-strong)}body.delusion-mode .profile-img{filter:contrast(1.2) saturate(1.5)}.cute-badge{background-color:var(--accent);color:var(--text-main);padding:8px 16px;border-radius:20px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:all 0.5s}.quote-box{background-color:var(--bg-body);border-radius:20px;padding:15px 20px;position:relative;transition:all 0.5s}.quote-box::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);border-width:0 10px 10px 10px;border-style:solid;border-color:transparent transparent var(--bg-body) transparent;transition:all 0.5s}.bubbly-btn{background-color:var(--accent-strong);color:white;border:none;border-radius:30px;padding:15px 30px;font-size:18px;cursor:pointer;box-shadow:0 8px 0 var(--text-main);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}.bubbly-btn:hover{transform:translateY(-2px);box-shadow:0 10px 0 var(--text-main)}.bubbly-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--text-main)}.comic-drop{position:fixed;pointer-events:none;z-index:50;color:var(--accent-strong);animation:spray 1.5s ease-in forwards}@keyframes spray{0%{transform:translateY(0) scale(1);opacity:1}30%{transform:translateY(-100px) scale(1.5)}100%{transform:translateY(100vh) scale(0.5);opacity:0}}.floating-heart{position:absolute;color:var(--accent-strong);animation:float-up 2s ease-out infinite;opacity:0}@keyframes float-up{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-50px) scale(1.2);opacity:0}}</style></head><body class="antialiased flex items-center justify-center p-4"><div class="polka-dots"></div><div class="comic-speedlines"></div><main class="w-full max-w-md relative z-10 pt-8"><a href="../index.html" class="inline-flex items-center gap-2 mb-6 text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors font-bold bubbly-font text-lg"><i class="fa-solid fa-circle-left text-2xl"></i> Kembali</a><div class="cute-card p-8 flex flex-col items-center text-center"><i class="fa-solid fa-flower card-decoration transition-all" id="corner-icon"></i><div class="relative mb-4 mt-2"><div class="profile-img-wrap"><img src="../src/chitose.jpg" alt="Chitose" class="profile-img" onerror="this.src='https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=300&auto=format&fit=crop'"></div><i class="fa-solid fa-heart floating-heart hidden" style="top:-10px;right:0" id="float-heart-1"></i><i class="fa-solid fa-heart floating-heart hidden" style="top:20px;left:-10px;animation-delay:0.5s" id="float-heart-2"></i></div><h1 class="bubbly-font text-3xl mb-3 tracking-wide" id="char-name">Chitose Ikeda</h1><div class="flex flex-wrap justify-center gap-2 mb-6"><div class="cute-badge" id="badge-club"><i class="fa-solid fa-users"></i> OSIS</div><div class="cute-badge" id="badge-food"><i class="fa-solid fa-bowl-rice"></i> Suka Tsukemono</div></div><div class="quote-box w-full mb-8"><p class="font-bold text-[var(--text-main)] text-sm leading-relaxed" id="char-quote">"Ehehe... Hari ini udara di ruang OSIS terasa sangat damai ya. Mau teh?"</p></div><button class="bubbly-font bubbly-btn group" onclick="toggleDelusion()"><i class="fa-solid fa-glasses text-2xl group-hover:rotate-12 transition-transform" id="btn-icon"></i><span id="btn-text">Lepas Kacamata!</span></button></div></main><script>const body=document.body;let isDelusion=false;let nosebleedInterval;const charName=document.getElementById('char-name');const badgeClub=document.getElementById('badge-club');const badgeFood=document.getElementById('badge-food');const charQuote=document.getElementById('char-quote');const btnIcon=document.getElementById('btn-icon');const btnText=document.getElementById('btn-text');const cornerIcon=document.getElementById('corner-icon');const floatHeart1=document.getElementById('float-heart-1');const floatHeart2=document.getElementById('float-heart-2');function toggleDelusion(){isDelusion=!isDelusion;if(isDelusion){body.classList.add('delusion-mode');charName.innerHTML="CHITOSE-CHAN!! <i class='fa-solid fa-dizzy'></i>";badgeClub.innerHTML="<i class='fa-solid fa-heart-pulse'></i> DETAK JANTUNG NAIK";badgeFood.innerHTML="<i class='fa-solid fa-droplet'></i> DARAH HABIS";charQuote.innerHTML="<span class='text-xl'>Fufufu... HAHH!!</span><br> Ayano-chan... Kyouko-chan... M-Mereka saling bersuapan?! Imajinasi macam apa ini?! AAAAA~ <i class='fa-solid fa-heart text-red-500'></i>";btnIcon.className="fa-solid fa-eye text-2xl";btnText.innerHTML="P-Pakai Kacamata Lagi!! 💦";cornerIcon.className="fa-solid fa-heart card-decoration transition-all";floatHeart1.classList.remove('hidden');floatHeart2.classList.remove('hidden');startComicNosebleed()}else{body.classList.remove('delusion-mode');charName.innerHTML="Chitose Ikeda";badgeClub.innerHTML="<i class='fa-solid fa-users'></i> OSIS";badgeFood.innerHTML="<i class='fa-solid fa-bowl-rice'></i> Suka Tsukemono";charQuote.innerHTML='"Ehehe... Hari ini udara di ruang OSIS terasa sangat damai ya. Mau teh?"';btnIcon.className="fa-solid fa-glasses text-2xl group-hover:rotate-12 transition-transform";btnText.innerHTML="Lepas Kacamata!";cornerIcon.className="fa-solid fa-asterisk card-decoration transition-all";floatHeart1.classList.add('hidden');floatHeart2.classList.add('hidden');stopComicNosebleed()}}function startComicNosebleed(){nosebleedInterval=setInterval(()=>{const drop=document.createElement('i');const isHeart=Math.random()>0.8;drop.className=`fa-solid ${isHeart?'fa-heart':'fa-droplet'} comic-drop`;const startX=50+(Math.random()*10-5);drop.style.left=startX+'vw';drop.style.top='40vh';drop.style.fontSize=(Math.random()*2+1)+'rem';document.body.appendChild(drop);setTimeout(()=>{if(document.body.contains(drop))drop.remove()},1500)},50)}function stopComicNosebleed(){clearInterval(nosebleedInterval);document.querySelectorAll('.comic-drop').forEach(drop=>drop.remove())}</script></body></html>
