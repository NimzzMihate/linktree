<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>A.N.H.S DB // SAKAYANAGI_A</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{fontFamily:{serif:['"Playfair Display"','serif'],mono:['"JetBrains Mono"','monospace']},colors:{arisu:{light:'#faf9fc',card:'#ffffff',text:'#2d1b4e',accent:'#9333ea',border:'#d8b4fe'},mastermind:{bg:'#05020a',card:'#10051c',text:'#f3e8ff',accent:'#c084fc',border:'#581c87'}}}}}</script><style>:root{--bg-body:#faf9fc;--bg-card:rgba(255,255,255,0.9);--text-main:#2d1b4e;--text-mono:#6b7280;--accent:#9333ea;--border-color:rgba(147,51,234,0.2);--shadow:0 20px 40px rgba(45,27,78,0.1)}body.mode-override{--bg-body:#05020a;--bg-card:rgba(16,5,28,0.85);--text-main:#f3e8ff;--text-mono:#a855f7;--accent:#c084fc;--border-color:rgba(192,132,252,0.3);--shadow:0 20px 50px rgba(147,51,234,0.2)}body{background-color:var(--bg-body);color:var(--text-main);transition:all 1s cubic-bezier(0.4,0,0.2,1);overflow-x:hidden;min-height:100vh}.terminal-grid{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--border-color) 1px,transparent 1px),linear-gradient(90deg,var(--border-color) 1px,transparent 1px);background-size:30px 30px;opacity:0.3;transition:all 1s;pointer-events:none}body.mode-override .terminal-grid{background-size:40px 40px;opacity:0.15;animation:grid-pulse 4s infinite alternate}@keyframes grid-pulse{0%{transform:scale(1)}100%{transform:scale(1.05)}}.chess-hologram{position:fixed;inset:0;z-index:-1;background-image:repeating-linear-gradient(45deg,var(--border-color) 25%,transparent 25%,transparent 75%,var(--border-color) 75%,var(--border-color)),repeating-linear-gradient(45deg,var(--border-color) 25%,transparent 25%,transparent 75%,var(--border-color) 75%,var(--border-color));background-position:0 0,50px 50px;background-size:100px 100px;opacity:0;transition:opacity 1.5s ease-in-out;pointer-events:none;transform:perspective(600px) rotateX(30deg);transform-origin:center top}body.mode-override .chess-hologram{opacity:0.05;animation:moveChess 20s linear infinite}@keyframes moveChess{100%{background-position:100px 100px,150px 150px}}.secure-card{background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border-color);border-top:3px solid var(--accent);box-shadow:var(--shadow);transition:all 1s}body.mode-override .secure-card{box-shadow:0 0 30px rgba(147,51,234,0.15),inset 0 0 20px rgba(147,51,234,0.05)}.profile-container{position:relative;padding:5px;background:linear-gradient(135deg,var(--accent),transparent);border-radius:50%;transition:all 1s}.profile-img{border:4px solid var(--bg-body);transition:all 1s;filter:contrast(1.1) saturate(0.9)}body.mode-override .profile-img{border-color:#05020a;filter:contrast(1.2) saturate(1.1)}.data-box{background:rgba(147,51,234,0.03);border:1px dashed var(--border-color);transition:all 0.5s}body.mode-override .data-box{background:rgba(0,0,0,0.4);border-style:solid}.dialog-box{position:relative;padding:1.5rem;border-left:2px solid var(--accent);background:linear-gradient(90deg,rgba(147,51,234,0.05),transparent);transition:all 1s}.dialog-text{font-family:'Playfair Display',serif;transition:opacity 0.4s}.override-btn{background:transparent;color:var(--text-main);border:1px solid var(--border-color);position:relative;overflow:hidden;transition:all 0.3s}.override-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--accent);transition:all 0.4s cubic-bezier(0.4,0,0.2,1);z-index:-1}.override-btn:hover{color:#fff;border-color:var(--accent)}.override-btn:hover::before{left:0}body.mode-override .override-btn{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 15px var(--accent)}body.mode-override .override-btn:hover{background:#fff;box-shadow:0 0 25px #fff}body.mode-override .override-btn::before{display:none}.chess-piece{position:fixed;color:var(--accent);opacity:0;z-index:50;pointer-events:none;filter:drop-shadow(0 0 8px var(--accent));animation:pieceFall linear forwards}@keyframes pieceFall{0%{transform:translateY(-10vh) rotate(0deg) scale(0.8);opacity:0}10%{opacity:0.5}90%{opacity:0.5}100%{transform:translateY(110vh) rotate(360deg) scale(1.2);opacity:0}}.cursor-blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}</style></head><body class="flex items-center justify-center p-4 sm:p-8"><div class="terminal-grid"></div><div class="chess-hologram"></div><main class="w-full max-w-lg relative z-10"><div class="flex justify-between items-center mb-6 px-1 font-mono text-xs uppercase tracking-widest"><a href="../index.html" class="flex items-center gap-2 text-[var(--text-mono)] hover:text-[var(--accent)] transition-colors group"><i class="fa-solid fa-chevron-left transition-transform group-hover:-translate-x-1"></i><span>CD .. /ROOT</span></a><div class="flex items-center gap-2 px-3 py-1 bg-[var(--bg-card)] border border-[var(--border-color)] text-[var(--accent)] transition-colors duration-1000" id="db-status"><i class="fa-solid fa-lock" id="status-icon"></i><span id="status-text">CLEARANCE_A</span></div></div><div class="secure-card p-8 flex flex-col relative"><i class="fa-solid fa-chess-queen absolute -top-4 -right-4 text-9xl opacity-[0.03] text-[var(--accent)] pointer-events-none transition-all duration-1000" id="watermark"></i><div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 mb-8 relative z-10"><div class="profile-container shrink-0"><img src="../src/sakayanagi.jpg" alt="Arisu Sakayanagi" class="profile-img w-32 h-32 object-cover rounded-full" onerror="this.src='https://images.unsplash.com/photo-1518386341258-3d1222e92c2b?q=80&w=300&auto=format&fit=crop'"></div><div class="text-center sm:text-left flex-1 pt-2"><p class="font-mono text-[10px] text-[var(--text-mono)] tracking-[0.3em] mb-1">ID: SKYN_001</p><h1 class="font-serif text-3xl sm:text-4xl font-bold mb-2 tracking-wide" id="char-name">Arisu Sakayanagi</h1><div class="inline-block px-3 py-1 bg-[var(--accent)]/10 border border-[var(--accent)]/30 rounded text-[var(--accent)] text-xs font-mono tracking-widest uppercase"><i class="fa-solid fa-chess-queen mr-1"></i> <span id="char-title">Class A Representative</span></div></div></div><div class="dialog-box mb-8"><p class="font-mono text-[10px] text-[var(--accent)] mb-2 uppercase tracking-widest flex items-center gap-2"><i class="fa-solid fa-terminal"></i> <span id="quote-label">INTERCEPTED_AUDIO_LOG</span></p><p class="dialog-text text-lg italic leading-relaxed" id="char-quote">"Fufu... Tidak ada yang kebetulan di dunia ini. Aku sudah mengetahui segalanya tentang masa lalumu sejak awal, 'False Genius'."</p></div><div class="grid grid-cols-2 gap-4 w-full mb-8 font-mono"><div class="data-box p-3 flex items-center gap-4 rounded-lg"><div class="w-10 h-10 rounded-full bg-[var(--accent)]/10 flex items-center justify-center text-[var(--accent)] text-lg border border-[var(--border-color)]"><i class="fa-solid fa-brain"></i></div><div><p class="text-[9px] text-[var(--text-mono)] tracking-widest uppercase">Intellectual</p><p class="font-bold text-lg">Rank A</p></div></div><div class="data-box p-3 flex items-center gap-4 rounded-lg"><div class="w-10 h-10 rounded-full bg-[var(--accent)]/10 flex items-center justify-center text-[var(--accent)] text-lg border border-[var(--border-color)]"><i class="fa-solid fa-person-walking-with-cane"></i></div><div><p class="text-[9px] text-[var(--text-mono)] tracking-widest uppercase">Physical</p><p class="font-bold text-lg text-red-500/80">Rank E-</p></div></div></div><button class="override-btn w-full py-4 font-mono font-bold tracking-[0.2em] uppercase text-xs flex items-center justify-center gap-3" onclick="toggleOverride()"><span class="text-[var(--accent)] transition-colors" id="btn-bracket-1">[</span><i class="fa-solid fa-code-branch" id="btn-icon"></i><span id="btn-text">EXECUTE: PROTOCOL_CHECKMATE</span><span class="text-[var(--accent)] transition-colors" id="btn-bracket-2">]</span></button><div class="mt-4 text-center"><span class="font-mono text-[10px] text-[var(--text-mono)] opacity-50">> A.N.H.S_DATABASE_V2.0 <span class="cursor-blink">_</span></span></div></div></main><script>const body=document.body;let isOverride=false;let chessInterval;const charName=document.getElementById('char-name');const charTitle=document.getElementById('char-title');const quoteLabel=document.getElementById('quote-label');const charQuote=document.getElementById('char-quote');const statusText=document.getElementById('status-text');const statusIcon=document.getElementById('status-icon');const watermark=document.getElementById('watermark');const btnIcon=document.getElementById('btn-icon');const btnText=document.getElementById('btn-text');const bracket1=document.getElementById('btn-bracket-1');const bracket2=document.getElementById('btn-bracket-2');function toggleOverride(){isOverride=!isOverride;if(isOverride){body.classList.add('mode-override');changeTextSmooth(charName,"Sakayanagi Arisu");changeTextSmooth(charTitle,"The White Room's Enemy");changeTextSmooth(quoteLabel,"DIRECT_CHALLENGE_LOG");changeTextSmooth(charQuote,'"Akan kubuktikan padamu, Ayanokouji Kiyotaka... bahwa kejeniusan alamilah yang pada akhirnya akan menghancurkan mahakarya buatan. Mari kita mulai... tarian terakhir kita."');statusIcon.className="fa-solid fa-triangle-exclamation text-red-500 animate-pulse";changeTextSmooth(statusText,"SYS_OVERRIDE");watermark.className="fa-solid fa-chess-king absolute -top-4 -right-4 text-9xl opacity-[0.05] text-[var(--accent)] pointer-events-none transition-all duration-1000";btnIcon.className="fa-solid fa-power-off";changeTextSmooth(btnText,"ABORT PROTOCOL");bracket1.style.color="#000";bracket2.style.color="#000";startChessRain()}else{body.classList.remove('mode-override');changeTextSmooth(charName,"Arisu Sakayanagi");changeTextSmooth(charTitle,"Class A Representative");changeTextSmooth(quoteLabel,"INTERCEPTED_AUDIO_LOG");changeTextSmooth(charQuote,'"Fufu... Tidak ada yang kebetulan di dunia ini. Aku sudah mengetahui segalanya tentang masa lalumu sejak awal, \'False Genius\'."');statusIcon.className="fa-solid fa-lock";changeTextSmooth(statusText,"CLEARANCE_A");watermark.className="fa-solid fa-chess-queen absolute -top-4 -right-4 text-9xl opacity-[0.03] text-[var(--accent)] pointer-events-none transition-all duration-1000";btnIcon.className="fa-solid fa-code-branch";changeTextSmooth(btnText,"EXECUTE: PROTOCOL_CHECKMATE");bracket1.style.color="";bracket2.style.color="";stopChessRain()}}function changeTextSmooth(element,newHTML){element.style.opacity='0';setTimeout(()=>{element.innerHTML=newHTML;element.style.opacity='1'},400)}function startChessRain(){const chessPieces=['fa-chess-pawn','fa-chess-knight','fa-chess-bishop','fa-chess-rook'];chessInterval=setInterval(()=>{const piece=document.createElement('i');const randomPiece=chessPieces[Math.floor(Math.random()*chessPieces.length)];piece.className=`fa-solid ${randomPiece} chess-piece`;piece.style.left=Math.random()*100+'vw';const size=Math.random()*2+1;piece.style.fontSize=size+'rem';const duration=Math.random()*4+5;piece.style.animationDuration=duration+'s';piece.style.opacity=Math.random()*0.3+0.1;document.body.appendChild(piece);setTimeout(()=>{if(document.body.contains(piece))piece.remove()},duration*1000)},500)}function stopChessRain(){clearInterval(chessInterval);document.querySelectorAll('.chess-piece').forEach(p=>{p.style.opacity='0';setTimeout(()=>p.remove(),1000)})}</script></body></html>
